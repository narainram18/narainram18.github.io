<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <style>
      .mono { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    </style>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14"/>
      <stop offset="100%" stop-color="#06080c"/>
    </linearGradient>
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0.2"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#141a24" stroke-width="0.8"/>
    </pattern>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="630" fill="url(#bg-grad)"/>
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.6"/>

  <!-- Outer Architectural Framing Border -->
  <rect x="36" y="36" width="1128" height="558" rx="16" fill="none" stroke="#1e293b" stroke-width="1.5"/>
  <rect x="36" y="36" width="1128" height="558" rx="16" fill="none" stroke="url(#border-grad)" stroke-width="1" opacity="0.4"/>

  <!-- Corner Technical Markers -->
  <path d="M 36 60 L 36 36 L 60 36" fill="none" stroke="#38bdf8" stroke-width="2"/>
  <path d="M 1140 36 L 1164 36 L 1164 60" fill="none" stroke="#38bdf8" stroke-width="2"/>
  <path d="M 36 570 L 36 594 L 60 594" fill="none" stroke="#38bdf8" stroke-width="2"/>
  <path d="M 1140 594 L 1164 594 L 1164 570" fill="none" stroke="#38bdf8" stroke-width="2"/>

  <!-- Top Header Strip -->
  <g transform="translate(76, 84)">
    <!-- Brand Icon -->
    <rect width="36" height="36" rx="8" fill="#111827" stroke="#374151" stroke-width="1"/>
    <text x="18" y="24" class="mono" font-size="14" font-weight="700" fill="#38bdf8" text-anchor="middle">NR</text>
    
    <text x="52" y="18" class="mono" font-size="11" font-weight="600" fill="#94a3b8" letter-spacing="1">SYSTEMS WORKSTATION // SPEC 2024–2027</text>
    <text x="52" y="32" class="mono" font-size="10" fill="#64748b">VIT CHENNAI · CLASS OF 2027</text>

    <!-- Status Pill -->
    <rect x="880" y="4" width="144" height="28" rx="14" fill="#0b1b17" stroke="#059669" stroke-width="1"/>
    <circle cx="896" cy="18" r="4" fill="#10b981"/>
    <text x="908" y="22" class="mono" font-size="10" font-weight="600" fill="#34d399">ONLINE // ACTIVE</text>
  </g>

  <!-- Main Hero Typography -->
  <g transform="translate(76, 210)">
    <text x="0" y="0" class="mono" font-size="14" font-weight="600" fill="#38bdf8" letter-spacing="2">PORTFOLIO &amp; SYSTEMS ARCHITECTURE</text>
    <text x="0" y="68" class="sans" font-size="64" font-weight="800" fill="#f8fafc" letter-spacing="-1.5">Narain Ram R M</text>
    
    <text x="0" y="128" class="sans" font-size="28" font-weight="600" fill="#94a3b8" letter-spacing="-0.5">Software Engineer</text>
    
    <!-- Focus Badges -->
    <g transform="translate(0, 160)">
      <rect x="0" y="0" width="110" height="32" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="55" y="20" class="mono" font-size="12" font-weight="500" fill="#cbd5e1" text-anchor="middle">Systems</text>

      <rect x="122" y="0" width="130" height="32" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="187" y="20" class="mono" font-size="12" font-weight="500" fill="#cbd5e1" text-anchor="middle">Networking</text>

      <rect x="264" y="0" width="180" height="32" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="354" y="20" class="mono" font-size="12" font-weight="500" fill="#cbd5e1" text-anchor="middle">Distributed Systems</text>

      <rect x="456" y="0" width="110" height="32" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="511" y="20" class="mono" font-size="12" font-weight="500" fill="#cbd5e1" text-anchor="middle">Robotics</text>

      <rect x="578" y="0" width="136" height="32" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="646" y="20" class="mono" font-size="12" font-weight="500" fill="#cbd5e1" text-anchor="middle">Applied AI / ML</text>
    </g>
  </g>

  <!-- Bottom Metadata Strip -->
  <g transform="translate(76, 524)">
    <line x1="0" y1="0" x2="1024" y2="0" stroke="#1e293b" stroke-width="1"/>
    
    <text x="0" y="28" class="mono" font-size="11" fill="#64748b">
      CANONICAL: <tspan fill="#94a3b8">https://narainram18.github.io</tspan>
    </text>
    
    <text x="480" y="28" class="mono" font-size="11" fill="#64748b">
      STACK: <tspan fill="#94a3b8">Java · C++ · Python · TypeScript · ROS 2</tspan>
    </text>

    <text x="940" y="28" class="mono" font-size="11" fill="#38bdf8" font-weight="600" text-anchor="start">
      narain18ram
    </text>
  </g>
</svg>
